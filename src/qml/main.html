<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html {
            /* TODO: high contrast mode */
            --hover: rgba(0, 0, 0, .03);
            --active: rgba(0, 0, 0, .05);
            --border: rgba(0, 0, 0, .15);
            --bg: var(--light-bg);
            --fg: var(--light-fg);
            --arianna-reader-background-image: none;
            --arianna-reader-background-position: center center;
            --arianna-reader-background-repeat: no-repeat;
            --arianna-reader-background-size: cover;
            --arianna-reader-background-filter: none;
            height: 100%;
        }

        body {
            margin: 0 auto;
            height: 100%;
            background-image: var(--arianna-reader-background-image);
            background-color: var(--bg);
            background-position: var(--arianna-reader-background-position);
            background-repeat: var(--arianna-reader-background-repeat);
            background-size: var(--arianna-reader-background-size);
            background-attachment: fixed;
            color: var(--fg);
        }

        body.invert {
            background: #000;
            color: #fff;
        }

        @media (prefers-color-scheme: dark) {
            html {
                --hover: rgba(255, 255, 255, .03);
                --active: rgba(255, 255, 255, .05);
                --border: rgba(255, 255, 255, .15);
                --bg: var(--dark-bg);
                --fg: var(--dark-fg);
            }
        }

        foliate-view::part(head),
        foliate-view::part(foot) {
            font-family: system-ui;
            font-size: 9pt;
        }

        foliate-view {
            --overlayer-highlight-blend-mode: multiply;
        }

        foliate-view::part(filter) {
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            foliate-view {
                --overlayer-highlight-blend-mode: screen;
            }
        }

        #ribbon {
            visibility: hidden;
            display: inline-block;
            position: absolute;
            left: 48px;
            z-index: 1;
        }

        #ribbon:before,
        #ribbon:after {
            content: "";
            display: block;
            position: absolute;
            height: 10px;
            border: 9px solid red;
        }

        #ribbon:before {
            border-bottom-color: transparent;
            bottom: -40px;
        }

        .reader-dialog {
            font: menu;
            padding: 0;
            border-radius: 12px;
            border: 0;
            box-shadow: 0 0 0 1px var(--border), 0 0 12px rgba(0, 0, 0, .2);
            -webkit-user-select: none;
            background: var(--bg);
            color: var(--fg);
            box-sizing: border-box;
            overflow: hidden;
        }

        .reader-dialog:not([open]) {
            display: none;
        }

        .reader-dialog--stacked {
            display: flex;
            flex-direction: column;
        }

        #footnote-dialog {
            width: 400px;
            height: 400px;
        }

        #reference-dialog,
        #create-reference-dialog {
            width: 500px;
        }

        #reference-dialog {
            height: 300px;
        }

        #create-reference-dialog {
            max-height: min(90vh, 600px);
        }

        #footnote-dialog>div {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .reader-dialog header {
            text-align: center;
            font-weight: bold;
            padding: 9px;
            border-bottom: 1px solid var(--border);
            cursor: default;
            flex: none;
        }

        .reader-dialog main {
            flex: 1;
            min-height: 0;
        }

        .reader-dialog--stacked>div,
        .reader-dialog--stacked main,
        #createReferenceForm {
            display: flex;
            flex-direction: column;
        }

        .reader-dialog--stacked>div {
            flex: none;
        }

        #reference-dialog .reference-preview-pane {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        #reference-dialog main,
        #create-reference-dialog main {
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 16px;
            box-sizing: border-box;
        }

        #reference-dialog main {
            flex: 0 1 auto;
            max-height: 40%;
        }

        #footnote-dialog form,
        .reader-dialog footer {
            display: flex;
            border-top: 1px solid var(--border);
        }

        .reader-dialog footer {
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        #footnote-dialog form button,
        .reader-dialog footer button {
            flex: 1;
            border: 0;
            margin: 0;
            padding: 12px 16px;
            font-weight: bold;
            color: inherit;
            background: none;
            min-width: 0;
        }

        #footnote-dialog form button+button,
        .reader-dialog footer button+button {
            border-inline-start: 1px solid var(--border);
        }

        #footnote-dialog form button:hover,
        .reader-dialog footer button:hover,
        #createReferenceForm button:hover {
            background: var(--hover);
        }

        #footnote-dialog form button:active,
        .reader-dialog footer button:active,
        #createReferenceForm button:active {
            background: var(--active);
        }

        #reference-dialog footer button:hover,
        #reference-dialog footer button:active {
            color: yellow;
        }

        #footnote-dialog foliate-view {
            display: block;
            width: 100%;
            height: 100%;
        }

        #referencePreview,
        #targetResults {
            padding: 0 8px;
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        #reference-dialog foliate-view,
        #referencePreview,
        #targetResults {
            display: block;
            width: 100%;
        }

        #referencePreview,
        #targetResults {
            flex: 1 1 auto;
            min-height: 0;
            max-height: 100%;
            overflow-y: auto;
        }

        #createReferenceForm {
            gap: 8px;
        }

        #createReferenceForm label {
            font-weight: bold;
        }

        #createReferenceForm input[type="text"],
        #createReferenceForm select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            background: var(--bg);
            color: var(--fg);
        }

        #createReferenceForm button {
            border: 1px solid var(--border);
            border-radius: 6px;
            margin-top: 8px;
            padding: 10px 12px;
            font-weight: bold;
            color: inherit;
            background: none;
        }

        @media (max-width: 500px) {
            .reader-dialog {
                margin: 0;
                margin-top: auto;
                width: 100%;
                max-width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
            }
        }
    </style>
</head>

<body>
    <script src="qrc:/qtwebchannel/qwebchannel.js"></script>
    <script src="reader.js" type="module"></script>
    <div id="viewer"></div>
    <dialog id="footnote-dialog" class="reader-dialog">
        <div>
            <header></header>
            <main></main>
            <form method="dialog">
                <input name="href" type="hidden">
                <button value="close"></button>
                <button value="go"></button>
            </form>
        </div>
    </dialog>

    <dialog id="reference-dialog" class="reader-dialog reader-dialog--stacked">
        <header id="referenceHeader">Referenz</header>
        <div class="reference-preview-pane">
            <div id="referencePreview" class="reference-preview"></div>
        </div>
        <main>

            <div id="targetResults"></div>
        </main>

        <footer>
            <button id="closeButton" value="close">Schließen</button>
            <button id="openReferenceButton" value="openRef">Referenz öffnen</button>
        </footer>
    </dialog>
    <dialog id="create-reference-dialog" class="reader-dialog reader-dialog--stacked">
        <header id="createReferenceHeader">Referenz erstellen</header>
        <main>
            <form id="createReferenceForm">
                <label for="targetBookId">Zielbuch:</label>
                <select id="targetBookId" name="targetBookId" required>
                    <option value="">-- Bitte wählen --</option>
                </select>

                <label for="targetLocationSelect">Zielort:</label>
                <select id="targetLocationSelect" name="targetLocationSelect">
                    <option value="">-- Keine Auswahl --</option>
                </select>

                <label for="targetCFI">Zielort-CFI:</label>
                <input type="text" id="targetCFI" name="targetCFI" placeholder="epubcfi(...)">

                <input type="hidden" id="targetAnchorId" name="targetAnchorId">
                <input type="hidden" id="targetLocation" name="targetLocation">
                <input type="hidden" id="targetPreviewHtml" name="targetPreviewHtml">


                <button type="submit">Referenz erstellen</button>
            </form>
        </main>

        <footer>
            <button id="closeCreateReferenceButton" value="close">Schließen</button>
        </footer>
    </dialog>
</body>

</html>
